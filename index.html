<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Exploration</title>
    <link rel="stylesheet" href="Style/style.css">
</head>
<body>


    <header class="navbar">
        <div class="nav-container">
            
            <!-- Logo -->
            <div class="logo">
                <img src="ASSETS/IMAGES/logo.png" height="40" alt="Logo">
                <div class="logo-text">
                    <span class="logo-main">Space</span>
                    <span class="logo-sub">Exploration</span>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="nav-menu" id="navMenu">
                <ul class="nav-links">
                    <li><a href="#home" class="active">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#missions">Missions</a></li>
                    <li><a href="#gallery">Gallery</a></li>
                    <li><a href="#news">News</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>

          
            <div class="nav-actions">
                <button id="themeToggle" class="theme-btn">☼</button>
                <button id="mobileToggle" class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>

        </div>
    </header>

       <!-- ===== HERO SECTION ===== -->
    <section id="home" class="hero">
        <div class="hero-container">
            <div class="hero-content">
                <span class="hero-badge">Explore the Universe</span>
                <h1 class="hero-title">
                    Beyond<br />
                    Boundaries.
                </h1>
                <p class="hero-desc">
                    Pushing the limits of technology and human innovation to explore 
                    the farthest reaches of space.
                </p>
                <a href="#missions" class="btn-primary">
                    Discover More →
                </a>
            </div>
            <div class="hero-image-wrapper">
                <img 
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/NASA-Apollo8-Dec24-Earthrise.jpg/1280px-NASA-Apollo8-Dec24-Earthrise.jpg" 
                    alt="Earth from space" 
                    class="hero-image"
                />
            </div>
        </div>
    </section>

   
     

    <script src="JS/script.js"></script>
</body>
</html>
