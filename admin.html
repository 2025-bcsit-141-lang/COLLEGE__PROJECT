<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Space Exploration</title>
    <link rel="stylesheet" href="Style/style.css">
    <link rel="stylesheet" href="Style/admin.css">
    <style>
       
    </style>
</head>
<body>
    <!-- LOGIN OVERLAY -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>Admin</h2>
            <p>enter credentials</p>
            <input type="text" id="adminUsername" placeholder="username" value="admin">
            <input type="password" id="adminPassword" placeholder="password" value="admin123">
            <button onclick="loginAdmin()">Login</button>
            <!-- button click vaye paxi validations .so we will check that in js -->
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- MAIN ADMIN DASHBOARD -->
    <div id="adminDashboard" style="display: none;">
        <div class="admin-container">
            <!-- Header -->
            <div class="admin-header">
                <div class="admin-title">
                    <img src="ASSETS/IMAGES/logo.png" height="32" alt="Logo">
                    <div>
                        <h1>Submissions</h1>
                        <span>form data</span>
                    </div>
                </div>
                <button onclick="logoutAdmin()" class="btn-logout">Logout</button>
                <!-- logoutadmin ko fucntion haldine js ma so idea for that.REMINDER -->
            </div>

            <!-- Controls -->
            <div class="admin-controls">
                <button onclick="exportSubmissions()" class="btn-export">Export JSON</button>
                <button onclick="refreshSubmissions()" class="btn-refresh">Refresh</button>
                <button onclick="clearAllSubmissions()" class="btn-clear">Clear All</button>
            </div>

            <!-- Submissions List -->
            <div id="submissionsContainer">
                <div class="submissions-grid" id="submissionsList">
                    <!-- js ma aauxa data js bata -->
                </div>
            </div>
        </div>
    </div>
<script src="JS/admin.js">
    
</script>
</body>
</html>
